<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/RegistrarAdministrativo-estilo.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap" rel="stylesheet">
<title>Inicio sesión - Nessfit</title>
</head>

<body>
         
         <div class="barraLateral">
         	<img src="/images/NESSFIT_LOGO.png">
         	<hr>
         	<a href="/MenuPrincipal" class="boton">
      			<span class="fs-4">Inicio</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistrarCliente" class="boton">
      			<span class="fs-4">Registrar cliente</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRADOR'}" href="/administrador/RegistrarAdministrativo" class="boton">
      			<span class="fs-4">Registrar administrativo</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO' || rolUser == 'CLIENTE'}" href="/CambiarContraseña" class="boton">
      			<span class="fs-4">Cambiar contraseña</span>
    		</a>
    		<a href="/MenuPrincipal" class="boton">
      			<span class="fs-4">Perfil</span>
    		</a>
    		<a href="/logout" class="boton">
      			<span class="fs-4">Cerrar Sesión</span>
    		</a>
         </div>
         <div class="menuContenido">
         	<div class="contenedor">
				<div class="contenedor2 ">
					<h1>Registrar administrativo</h1>
					<hr>
					<div class="casilla">
						<form th:action="@{/CambiarContraseña}"
							method="post" id="demo-form2" data-parsley-validate
							class="form-horizontal form-label-left">
							
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">RUT:      
								<input th:value="${nuevaContrasena}" name="nuevaContrasena" type="text" required="required" class="casillaRut">
									<div class= cajaError>
  										<span th:if="${msg != null}" class="error" role="alert">
  										El largo de la contraseña debe estar entre 10 y 15 caracteres.
                    					</span>
                    					<span th:if="${msg2 != null}" class="error" role="alert">
  										Las contraseñas no coinciden.
                    		 			</span>
                    				</div>
								</label>
								<div>
                    			</div>
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Nombre:
								<input th:value="${nuevaContrasena}" name="nuevaContrasena" type="text" required="required" class="casillaNombre">
									<div class= cajaError>
  										<span th:if="${msg != null}" class="error" role="alert">
  										El largo de la contraseña debe estar entre 10 y 15 caracteres.
                    					</span>
                    					<span th:if="${msg2 != null}" class="error" role="alert">
  										Las contraseñas no coinciden.
                    		 			</span>
                    				</div>
								</label>
								<div>
                    			</div>
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Apellido:
								<input th:value="${nuevaContrasena}" name="nuevaContrasena" type="text" required="required" class="casillaApellido">
									<div class= cajaError>
  										<span th:if="${msg != null}" class="error" role="alert">
  										El largo de la contraseña debe estar entre 10 y 15 caracteres.
                    					</span>
                    					<span th:if="${msg2 != null}" class="error" role="alert">
  										Las contraseñas no coinciden.
                    		 			</span>
                    				</div>
								</label>
								<div>
                    			</div>
							</div>
                    		<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Teléfono:
								<input th:value="${nuevaContrasena}" name="nuevaContrasena" type="text" required="required" class="casillaTelefono">
									<div class= cajaError>
  										<span th:if="${msg != null}" class="error" role="alert">
  										El largo de la contraseña debe estar entre 10 y 15 caracteres.
                    					</span>
                    					<span th:if="${msg2 != null}" class="error" role="alert">
  										Las contraseñas no coinciden.
                    		 			</span>
                    				</div>
								</label>
								<div>
                    			</div>
							</div>
                    		<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Correo electrónico:
								<input th:value="${nuevaContrasena}" name="nuevaContrasena" type="text" required="required" class="casillaCorreo">
									<div class= cajaError>
  										<span th:if="${msg != null}" class="error" role="alert">
  										El largo de la contraseña debe estar entre 10 y 15 caracteres.
                    					</span>
                    					<span th:if="${msg2 != null}" class="error" role="alert">
  										Las contraseñas no coinciden.
                    		 			</span>
                    				</div>
								</label>
								<div>
                    			</div>
							</div>
                    		<div class="casillaBotones">
								<div class="botonActualizar">
									<a type="submit" id="openModal" class="actualizar">Actualizar</a>
								</div>
								<div id="myModal" class="modal">
      								<div class="modal-content">
        								<span class="close">&times;</span>
        								<p class="botonModal">¿Estás seguro?</p>
        								<div class="botonModal">
        									<a id="close" class="cancelar">Cancelar</a>
        									<button type="submit" class="aceptar">Aceptar</button>
        								</div>	
      								</div>	
    							</div>
    							<script src="js/Consulta.js"></script>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
</body>
</html>

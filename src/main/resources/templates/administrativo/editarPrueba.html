<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<link rel="stylesheet" th:href="@{/css/ListaInstalaciones.css}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap" rel="stylesheet">
<title>Inicio sesi�n - Nessfit</title>
</head>

<body>

<div class="barraLateral">
         	<img src="/images/NESSFIT_LOGO.png">
         	<hr>
         	<a href="/MenuPrincipal" class="boton">
      			<span class="fs-4">Inicio</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistrarCliente" class="boton">
      			<span class="fs-4">Registrar cliente</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRADOR'}" href="/administrador/RegistrarAdministrativo" class="boton">
      			<span class="fs-4">Registrar administrativo</span>
    		</a>
    		
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistarInstalacionDeportiva" class="boton">
      			<span class="fs-4">Registrar Instalacion</span>
    		</a>
    		
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/editarPrueba" class="boton">
      			<span class="fs-4">Editar Datos de Instalaciones</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO' || rolUser == 'CLIENTE'}" href="/EditarDatos" class="boton">
      			<span class="fs-4">Editar datos</span>
    		</a>
    		<a href="/CambiarContrase�a" class="boton">
      			<span class="fs-4">Cambiar contrase�a</span>
    		</a>
    		<a href="/logout" class="boton">
      			<span class="fs-4">Cerrar Sesi�n</span>
    		</a>
         </div>
         
         <div class="menuContenido">
			<div class="barraSuperior">
         		<div>
         			<p  th:text="${rutUser}" class="botonSuperior"></p>
         		</div>
        	 </div>
        	  <div class = "contenedor">
        	 	<div class = "contenedor2">
        	 		<h1>Lista de instalaciones deportivas</h1>
					<hr>
				<div class = "casilla">
					<table class = "table">
					<thead >
						<tr >
					<th> NOMBRE </th>
					<th> DIRECCION </th>
					<th> TIPO </th>
					<th> ESTADO </th>
					<th> COSTO ARRIENDO</th>	
				</tr>
			</thead >
			<tbody >
				<tr th:each="listaInstalaciones : ${AllInstalaciones}">
					<td th:text = "${listaInstalaciones.nombre}">  </td>
					<td th:text = "${listaInstalaciones.direccion}">  </td>
					<td th:text = "${listaInstalaciones.tipo}">  </td>
					<td th:text = "${listaInstalaciones.estado} == 1? 'HABILITADO' : 'DESHABILITADO'" ><td>
					
					<td th:text = "${listaInstalaciones.costoArriendo}"> </td>	
					<td > 
					
					<a  th:href ="@{/administrativo/editar/{nombre} (nombre = ${listaInstalaciones.nombre})} " class = "btn btn-warning"   > Editar </a>
					</td>
				</tr>
			</tbody>
				
		</table>
		<nav th:if="${AllInstalaciones.totalPages > 0}"
			aria-label="Page navigation example">
			<ul class="pagination justify-content-center">
				<li class="page-item"
					th:classappend="${AllInstalaciones.number == 0 ? 'disabled' : ''}"><a
					th:href="@{/administrativo/editarPrueba(page=${AllInstalaciones.number - 1})}"
					class="page-link">Anterior</a></li>

				<li class="page-item"
					th:classappend="${i eq AllInstalaciones.number + 1} ? 'active'"
					th:each="i : ${#numbers.sequence( 1, AllInstalaciones.totalPages, 1)}">
					<a class="page-link"
					th:href="@{/administrativo/editarPrueba?page={tmpPag} (tmpPag=${i-1}) }"
					th:text="${i}" th:title="${'Page '+ i}" data-toggle="tooltip"></a>
				</li>
				<li class="page-item"
					th:classappend="${AllInstalaciones.number == (AllInstalaciones.totalPages - 1) ? 'disabled' : ''}">
					<a
					th:href="@{/administrativo/editarPrueba(page=${AllInstalaciones.number + 1})}"
					class="page-link">Siguiente</a>
				</li>
			</ul>
		</nav>
	</div>
	</div>
	<p class=" copyright">Nessfit� 2022.</p>
</div>
</body>
</html>

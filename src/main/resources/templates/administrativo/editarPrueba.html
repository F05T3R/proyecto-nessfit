        	 </div>

					<hr>
				<div class = "casilla">

					<th> DIRECCION </th>
					<th> TIPO </th>
					<th> ESTADO </th>
					<th> COSTO ARRIENDO</th>	
				</tr>
			</thead >
			<tbody >
				<tr th:each="instalacionDeportiva : ${AllInstalaciones}">

					<td th:text = "${instalacionDeportiva.tipo}">  </td>

					<td th:text = "${instalacionDeportiva.costoArriendo}"> </td>
					<td>
						<a  th:href ="@{/administrativo/editarPrueba/editar/{nombre} (nombre = ${instalacionDeportiva.nombre})} " class = "btn btn-warning"   > Editar </a>
				</td>
				</tr>
			</tbody>
				
		</table>

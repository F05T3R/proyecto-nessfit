<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/RegistrarAdministrativo-estilo.css}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap" rel="stylesheet">
<title>Inicio sesión - Nessfit</title>
</head>

<body>
         
         <div class="barraLateral">
         	<img src="/images/NESSFIT_LOGO.png">
         	<hr>
         	<a href="/MenuPrincipal" class="boton">
      			<span class="fs-4">Inicio</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistrarCliente" class="boton">
      			<span class="fs-4">Registrar cliente</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRADOR'}" href="/administrador/RegistrarAdministrativo" class="boton">
      			<span class="fs-4">Registrar administrativo</span>
      		
      		
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO' || rolUser == 'CLIENTE'}" href="/EditarDatos" class="boton">
      			<span class="fs-4">Editar datos</span>
    		</a>
    		<a href="/CambiarContraseña" class="boton">
      			<span class="fs-4">Cambiar contraseña</span>
    		</a>
    		<a href="/logout" class="boton">
      			<span class="fs-4">Cerrar Sesión</span>
    		</a>
         </div>
         <div class="menuContenido">
         	<div class="barraSuperior">
         		<div>
         			<p  th:text="${rutUser}" class="botonSuperior"></p>
         		</div>
        	 </div>
         	<div class="contenedor">
				<div class="contenedor2 ">
					<h1> Editar Instalacion Deportiva</h1>
					<hr>
					<div class="casilla">
						<form th:action="@{/administrativo/editar/{nombre} (nombre = ${instalacionDeportiva.nombre})}"
							method="post" id="demo-form2" data-parsley-validate
							class="form-horizontal form-label-left" th:object="${instalacionDeportiva}">
							
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="rut">Nombre:     
								<input th:field="*{nombre}" name="nombre" type="text" required="required" hidden class="casillaNombre" readonly = "readonly">
								<input th:field="*{nombre}" type="text" disabled="disabled" class="casillaNombre">
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('nombre')}"
													th:errorclass="text-danger" th:errors="*{nombre}"></div>
                    				</div>
											
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Direccion:
								<input th:field="*{direccion}" name="direccion" type="text" required="required" class="casillaDireccion">
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('direccion')}"
													th:errorclass="text-danger" th:errors="*{direccion}"></div>
                    				</div>
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="tipo">Tipo:
								
									<select th:field = "*{tipo}"  >
										<option th:each = "tipos : ${tiposInstalaciones}"
											th:text = "${tipos.getTipo}"
											th:value = "${tipos}"
									
										></option> 
									
									</select>
									
							
							
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('tipo')}"
													th:errorclass="text-danger" th:errors="*{tipo}"></div>
                    				</div>
							</div>
                    		<div>
                    		
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="costoArriendo">Costo:
								<input th:field="*{costoArriendo}" name="costoArriendo" type="text" required="required" class="casillaCostoArriendo">
								</label>
								<div class= "cajaError">
									<div class="error" th:if="${#fields.hasErrors('costoArriendo')}"
													th:errorclass="text-danger" th:errors="*{costoArriendo}"></div>
                    				</div>
							</div>
                    		<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="estado">Estado:
								
								<select th:field = "*{estado}">
								  
								  <option th:value="1" >OPERATIVA
								  <option th:value="0" >INOPERATIVA
								  
								  
								  </option>
								</select>
								
								
								</label>
								<div class = "cajaError">
										<div th:if="${#fields.hasErrors('estado')}"
													th:errorclass="text-danger" th:errors="*{estado}">
										</div>
                    				</div>
							</div>
                    		<div class="casillaBotones">
								<div class="botonActualizar">
									<a type="submit" id="openModal" class="actualizar"> Editar </a>
								</div>
								<div id="myModal" class="modal">
      								<div class="modal-content">
        								<span class="close">&times;</span>
        								<p class="botonModal">¿Estás seguro?</p>
        								<div class="botonModal">
        									<button type="submit" class="aceptar">Aceptar</button>
        									<a id="close" class="cancelar">Cancelar</a>
        								</div>	
      								</div>	
    							</div>
    							<script th:src="@{/js/Consulta.js}"></script>
							</div>
						</form>
						
					</div>
				</div>
			</div>
			<p class=" copyright">Nessfit© 2022.</p>
		</div>
</body>
</html>

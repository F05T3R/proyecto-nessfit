<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/ListaInstalaciones.css}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
	href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap"
	rel="stylesheet">
<title>Inicio sesión - Nessfit</title>
</head>

<body>

	<div class="barraLateral">
		<img src="/images/NESSFIT_LOGO.png">
		<hr>
		<a href="/MenuPrincipal" class="boton"> <span class="fs-4">Inicio</span>
		</a> <a th:if="${rolUser == 'ADMINISTRATIVO'}"
			href="/administrativo/RegistrarCliente" class="boton"> <span
			class="fs-4">Registrar cliente</span>
		</a> <a th:if="${rolUser == 'ADMINISTRADOR'}"
			href="/administrador/RegistrarAdministrativo" class="boton"> <span
			class="fs-4">Registrar administrativo</span>
		</a> <a th:if="${rolUser == 'ADMINISTRATIVO'}"
			href="/administrativo/RegistarInstalacionDeportiva" class="boton">
			<span class="fs-4">Registrar Instalacion</span>
		</a> <a th:if="${rolUser == 'ADMINISTRATIVO'}"
			href="/administrativo/editarPrueba" class="boton"> <span
			class="fs-4">Editar Datos de Instalaciones</span>
		</a> <a th:if="${rolUser == 'ADMINISTRATIVO' || rolUser == 'CLIENTE'}"
			href="/EditarDatos" class="boton"> <span class="fs-4">Editar
				datos</span>
		</a> <a href="/CambiarContrase�a" class="boton"> <span class="fs-4">Cambiar
				contraseña</span>
		</a> <a href="/logout" class="boton"> <span class="fs-4">Cerrar
				Sesión</span>
		</a>
	</div>

	<div class="menuContenido">
		<div class="barraSuperior">
			<div>
				
			</div>
		</div>
		<div class="contenedor">
			<div class="contenedor2">
				<h1 th:if="${lista.isEmpty()}">No hay solicitudes por mostrar</h1>
				<h1 th:if="!${lista.isEmpty()}">Lista de Solicitudes</h1>
				<hr>
				
				<a th:if="!${lista.isEmpty()}" class="nav-link" th:href="@{/cliente/verSolicitudes/(format=pdf)}"
					title="Exportar a PDF" target="_blank"> Exportar a PDF
				</a>
				
				<div class="casilla">
					<table th:if="!${lista.isEmpty()}" class="table">
						<thead>
							<tr>
								<th>ID</th>
								<th>FECHA</th>
								<th>CENTRO</th>
								<th>COSTO TOTAL</th>
								<th>RUT</th>
								<th>NOMBRE CLIENTE</th>
								<th>ESTADO</th>
							</tr>
						</thead>
						<tbody>
						 	
							<tr th:if="!${lista.isEmpty()}" th:each=" solicitud : ${lista}" >
								<td th:text="${solicitud.id}"></td>
								<td th:text="${solicitud.fechaCompra}"></td>
								<td th:text="${solicitud.nombreCentro}"></td>
								<td th:text="${solicitud.totalPagar}"></td>
								<td th:text="${solicitud.usuario.rut}"></td>
								<td th:text="${solicitud.usuario.nombre} + ' ' + ${solicitud.usuario.apellido}" ></td>
								<td th:if="${solicitud.estado == 0}"    th:text="PENDIENTE"></td>
								<td th:if="${solicitud.estado == 1}"    th:text="APROBADA"></td>
								<td th:if="${solicitud.estado == -1}"    th:text="CANCELADA"></td>
								
								<td>
								<a id = "${solicitud.id} "  th:href="@{/cliente/verSolicitud/{id} (id = ${solicitud.id})}"
									class="botonEditar" 
								    > Ver detalle </a></td>
									
							</tr>
						</tbody>

					</table>
					
				</div>
			</div>
		</div>
		<p class=" copyright">Nessfit© 2022.</p>
	</div>
</body>
</html>

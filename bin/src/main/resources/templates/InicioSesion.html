<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/InicioSesion-estilo.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap" rel="stylesheet">
<title>Inicio sesión - Nessfit</title>
</head>

<body>
  
<div class="contenedor">
	<div class="contenedor2" >
		<div class="menuLogo">
			<div>
				<img src="/images/NESSFIT_LOGO.png">
			</div>
		</div>
		<div class="menuBoton">
			<h1>Inicia sesión en Nessfit</h1>

			<form th:action="@{/InicioSesion}" method="post">
				<div class="casillas">
					<label class="rut" for="rut">RUT:</label>
  					<input class="rut"  type="text" id="rut" name="rut" required>
  					<div class= cajaError>
  						<span th:if="${param.novalido}" class="error" role="alert">
  							Las credenciales de acceso son incorrectas o el usuario no está registrado en el sistema.
                    	</span>
                    	<span th:if="${param.noautorizado}" class="error" role="alert">
  							Usuario deshabilitado. Contacte al administrador.
                    	</span>
  					</div>
  					<label class="contraseña"  for="contrasena">Contraseña:</label>
  					<input class="contraseña"  type="password" id="contrasena" name="contrasena" required>
				</div>
				<div class="botonIniciar">
				<input id="botonIniciar" style="float: none;" class="botonIniciar" type="submit" th:value="${'Iniciar sesión'}"></input>
				</div>
			</form>
		</div>
	</div>
</div>
</body>
</html>

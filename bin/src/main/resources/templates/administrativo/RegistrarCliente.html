<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/RegistrarAdministrativo-estilo.css}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500&display=swap" rel="stylesheet">
<title>Inicio sesión - Nessfit</title>
</head>

<body>
         
         <div class="barraLateral">
         	<img src="/images/NESSFIT_LOGO.png">
         	<hr>
         	<a href="/MenuPrincipal" class="boton">
      			<span class="fs-4">Inicio</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistrarCliente" class="boton">
      			<span class="fs-4">Registrar cliente</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO'}" href="/administrativo/RegistarInstalacionDeportiva" class="boton">
      			<span class="fs-4">Registrar Instalacion</span>
    		</a>
    		
    		<a th:if="${rolUser == 'ADMINISTRADOR'}" href="/administrador/RegistrarAdministrativo" class="boton">
      			<span class="fs-4">Registrar administrativo</span>
    		</a>
    		<a th:if="${rolUser == 'ADMINISTRATIVO' || rolUser == 'CLIENTE'}" href="/EditarDatos" class="boton">
      			<span class="fs-4">Editar datos</span>
    		</a>
    		<a href="/CambiarContraseña" class="boton">
      			<span class="fs-4">Cambiar contraseña</span>
    		</a>
    		<a href="/logout" class="boton">
      			<span class="fs-4">Cerrar Sesión</span>
    		</a>
         </div>
         <div class="menuContenido">
         	<div class="barraSuperior">
         		<div>
         			<p  th:text="${rutUser}" class="botonSuperior"></p>
         		</div>
        	 </div>
         	<div class="contenedor">
				<div class="contenedor2 ">
					<h1>Registrar cliente</h1>
					<hr>
					<div class="casilla">
						<form th:action="@{/administrativo/RegistrarCliente}"
							method="post" id="demo-form2" data-parsley-validate
							class="form-horizontal form-label-left" th:object="${usuario}">
							
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="rut">RUT:     
								<input placeholder= "112223334" th:field="*{rut}" type="text" required="required" class="casillaRut">
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('rut')}"
													th:errorclass="text-danger" th:errors="*{rut}"></div>
                    				</div>
											
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="nombre">Nombre:
								<input th:field="*{nombre}"name="nombre" type="text" required="required" class="casillaNombre">
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('nombre')}"
													th:errorclass="text-danger" th:errors="*{nombre}"></div>
                    				</div>
							</div>
							<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="apellido">Apellido:
								<input th:field="*{apellido}" name="apellido" type="text" required="required" class="casillaApellido">
								</label>
								<div class= "cajaError">
									<div th:if="${#fields.hasErrors('apellido')}"
													th:errorclass="text-danger" th:errors="*{apellido}"></div>
                    				</div>
							</div>
                    		<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="telefono">Teléfono:
								<input th:field="*{telefono}" name="telefono" type="text" required="required" class="casillaTelefono">
								</label>
								<div class= "cajaError">
									<div class="error" th:if="${#fields.hasErrors('telefono')}"
													th:errorclass="text-danger" th:errors="*{telefono}"></div>
                    				</div>
							</div>
                    		<div>
								<label class="col-form-label col-md-3 col-sm-3 label-align"
								for="correo">Correo electrónico:
								<input th:field="*{email}" placeholder="ejemplo@ejemplo.com" name="correo" type="text" required="required" class="casillaCorreo">
								</label>
								<div class = "cajaError">
										<div th:if="${#fields.hasErrors('email')}"
													th:errorclass="text-danger" th:errors="*{email}">
										</div>
                    				</div>
							</div>
                    		<div class="casillaBotones">
								<div class="botonActualizar">
									<a type="submit" id="openModal" class="actualizar">Registrar</a>
								</div>
								<div id="myModal" class="modal">
      								<div class="modal-content">
        								<span class="close">&times;</span>
        								<p class="botonModal">¿Estás seguro?</p>
        								<div class="botonModal">
        									<button type="submit" class="aceptar">Aceptar</button>
        									<a id="close" class="cancelar">Cancelar</a>
        								</div>	
      								</div>	
    							</div>
    							<script th:src="@{/js/Consulta.js}"></script>
							</div>
						</form>
						
					</div>
				</div>
			</div>
			<p class=" copyright">Nessfit© 2022.</p>
		</div>
</body>
</html>
